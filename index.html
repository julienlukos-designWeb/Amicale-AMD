<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Session morte (déconnectée ailleurs ou expirée) : on renvoie à la connexion au lieu d'afficher une page vide
let sessionMorteFaite = false;
async function sessionMorte() {
  if (sessionMorteFaite) return; sessionMorteFaite = true;
  try { await SB.auth.signOut({ scope: 'local' }); } catch (_) {}
  try { Object.keys(localStorage).filter(k => k.startsWith('sb-')).forEach(k => localStorage.removeItem(k)); } catch (_) {}
  me = null; page = 'home'; tab = 'in'; msg = 'Ta session a expiré. Reconnecte-toi avec ton numéro et ton mot de passe.';
  render(); sessionMorteFaite = false;
}
const SB = supabase.createClient('https://fwodbaildriqkmpplutj.supabase.co', 'sb_publishable_yDfRe6HmyHgGVo1AuuosYg_h9LDlWLA', {
  global: { fetch: async (u, o) => { const r = await fetch(u, o); if (r.status === 401 && String(u).includes('/rest/v1/') && typeof me !== 'undefined' && me) setTimeout(sessionMorte, 0); return r; } }
});
const SLOGAN = 'Foula - Fiit - Fayda';
let BR = { name: 'A.M.D', logo: 'logo.png' };
const logo = () => BR.logo ? `<img src="${esc(BR.logo)}" alt="Logo" onerror="this.outerHTML='Logo'">` : 'Logo';
const FOOT = 'Développeur et administrateur : Julien D. Y. Lukos';
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits = p => String(p).replace(/\D/g, '');
const mail = p => digits(p) + '@amicale-c17.com';
let me = null, page = 'home', menu = false, tab = 'in', msg = '';
const isAdm = () => me && ['admin', 'owner'].includes(me.role);
const isOwn = () => me && me.role === 'owner';
const BURGER = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>';
const COL = {teal:['#0f766e','#134e4a'], blue:['#2563eb','#1e3a8a'], green:['#15803d','#14532d'], red:['#b91c1c','#7f1d1d'], gray:['#4b5563','#1f2937'], vio:['#7c3aed','#4c1d95'], or:['#c2410c','#7c2d12']};
const btn = (t, fn, c) => `<button class="b" style="--c:${COL[c][0]};--d:${COL[c][1]}" onclick="${fn}">${t}</button>`;
const IC = { home: 'M3 11l9-8 9 8v10a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z', user: 'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0', wallet: 'M3 7h16a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2zM3 7l2-3h12M16 14h2', users: 'M9 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM2 20a7 7 0 0114 0M17 4a3.5 3.5 0 010 7M22 20a7 7 0 00-4-6', inbox: 'M4 13l2-8h12l2 8M4 13v6h16v-6M4 13h5l1 2h4l1-2h5', list: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01', gear: 'M12 15a3 3 0 100-6 3 3 0 000 6zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2', out: 'M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9' };
const ico = n => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC[n]}"/></svg>`;

async function loadBrand() {
  const { data } = await SB.from('amicale_settings').select('key,value').in('key', ['amicale_name', 'amicale_logo', 'notif_obligatoire']);
  (data || []).forEach(r => { if (r.key === 'amicale_name' && r.value) BR.name = r.value; if (r.key === 'amicale_logo') BR.logo = r.value || 'logo.png'; if (r.key === 'notif_obligatoire') BR.notifOblig = r.value === 'oui'; });
  document.title = BR.name;
}
async function boot() {
  await loadBrand();
  let { data: { session } } = await SB.auth.getSession();
  me = null;
  if (session) {
    // Vérifie auprès du serveur que la session est encore valable
    const { error: ue } = await SB.auth.getUser();
    if (ue) { const { data: rf, error: re } = await SB.auth.refreshSession(); if (re || !rf?.session) { await SB.auth.signOut({ scope: 'local' }).catch(() => {}); try { Object.keys(localStorage).filter(k => k.startsWith('sb-')).forEach(k => localStorage.removeItem(k)); } catch (_) {} session = null; msg = 'Ta session a expiré. Reconnecte-toi avec ton numéro et ton mot de passe.'; } else session = rf.session; }
  }
  if (session) {
    const { data } = await SB.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    me = data;
    if (!me) { await SB.auth.signOut({ scope: 'local' }); msg = 'Compte introuvable. Crée un compte.'; }
  }
  // Ouverture depuis une notification : ?p=annonce → page Annonces
  const qp = new URLSearchParams(location.search).get('p');
  if (qp) { if (me && TITRES[qp]) page = qp; history.replaceState(null, '', location.pathname); }
  render();
  if (me && me.status === 'active') pushInit();
}

function authView() {
  const up = tab === 'up';
  return `<div class="ctr"><div class="big">${logo()}</div><div style="font-weight:800;font-size:17px">${esc(BR.name)}</div><div class="s">${SLOGAN}</div>
  <div class="tabs"><button class="${up ? '' : 'on'}" onclick="setTab('in')">Connexion</button><button class="${up ? 'on' : ''}" onclick="setTab('up')">Créer un compte</button></div>
  ${msg ? `<div class="err" role="alert">${esc(msg)}</div>` : ''}
  <form class="left" onsubmit="${up ? 'signup' : 'signin'}(event)">
  ${up ? `<label class="s">Prénom<input class="f" name="fn" required autocomplete="given-name"></label><label class="s" style="display:block;margin-top:10px">Nom (chiffres acceptés, ex. : Sarr N°1)<input class="f" name="ln" required autocomplete="family-name" placeholder="Sarr N°1"></label>` : ''}
  <label class="s" style="display:block;margin-top:10px">Numéro de téléphone<input class="f" name="ph" type="tel" required autocomplete="tel"></label>
  <label class="s" style="display:block;margin-top:10px">Mot de passe${up ? ' (6 caractères minimum)' : ''}<input class="f" name="pw" type="password" required minlength="6" autocomplete="${up ? 'new-password' : 'current-password'}"></label>
  <button class="b" style="width:100%;margin-top:18px;--c:${up ? '#15803d' : '#2563eb'};--d:${up ? '#14532d' : '#1e3a8a'}">${up ? 'Créer mon compte' : 'Se connecter'}</button></form>
  ${up ? '<div class="s">Un administrateur validera ton compte avant ta première connexion.</div>' : ''}
  <div class="ft">${FOOT}</div></div>`;

  return `<div class="c" style="background:linear-gradient(135deg,#1e3a8a,#2563eb)"><div style="font-size:13px;color:#dbeafe">Membres joignables par notification</div><div style="font-size:28px;font-weight:800;margin-top:4px">${on} / ${NM.length}</div><div style="font-size:13px;color:#dbeafe;margin-top:4px">Les autres doivent ouvrir A.M.D sur leur téléphone et toucher « Activer les notifications ».</div></div>
  ${NM.length - on ? `<details class="c"><summary style="font-weight:700;cursor:pointer">🔕 ${NM.length - on} membre(s) sans notifications</summary><div style="margin-top:8px">${NM.filter(m => !m.nb_appareils).map(m => `<div class="row"><div>${esc(m.first_name)} ${esc(m.last_name)}<div class="s">${esc(m.phone || '')}</div></div></div>`).join('')}</div></details>` : ''}
  <form class="c" onsubmit="notifyGo(event)"><div style="font-weight:700;font-size:16px">Nouveau message</div>
  <label class="s" style="display:block;margin-top:12px">Titre<input class="f" name="titre" required maxlength="80" placeholder="Ex. : Réunion de l’amicale"></label>
  <label class="s" style="display:block;margin-top:12px">Message<textarea class="f" name="message" rows="4" required maxlength="500" placeholder="Ex. : Réunion samedi à 16h au siège. Présence obligatoire."></textarea></label>
  <label class="s" style="display:block;margin-top:12px">Destinataires<select class="f" name="cible" onchange="$('#ml').style.display=this.value==='selection'?'block':'none'"><option value="tous">Tous les membres</option><option value="admins">Administrateurs seulement</option><option value="selection">Choisir des membres</option></select></label>
  <div id="ml" style="display:none"><input class="f" type="search" placeholder="Rechercher un membre" oninput="const q=norm(this.value).trim();document.querySelectorAll('#ml label').forEach(l=>l.style.display=norm(l.textContent).includes(q)?'':'none')"><div class="mlist">${list || '<div class="s" style="padding:12px">Aucun membre actif.</div>'}</div></div>
  <button class="b" style="width:100%;margin-top:16px;--c:#facc15;--d:#a16207;color:#1c1917;text-shadow:none">📣 Envoyer la notification</button><div id="nres"></div></form>
  <div class="c" style="padding-top:8px;padding-bottom:8px"><div style="font-weight:700;padding:8px 0">Derniers envois</div>${hl || '<div class="s" style="padding-bottom:8px">Aucune notification envoyée pour le moment.</div>'}</div>`;
}
async function notifyGo(e) {
  e.preventDefault(); const f = new FormData(e.target), bt = e.target.querySelector('button'), out = $('#nres');
  const body = { titre: f.get('titre').trim(), message: f.get('message').trim(), cible: f.get('cible'), ids: f.getAll('ids') };
  if (body.cible === 'selection' && !body.ids.length) { out.innerHTML = '<div class="err" style="margin-top:10px">Coche au moins un membre.</div>'; return; }
  const qui = body.cible === 'tous' ? 'tous les membres' : body.cible === 'admins' ? 'les administrateurs' : body.ids.length + ' membre(s)';
  if (!confirm(`Envoyer « ${body.titre} » à ${qui} ?`)) return;
  bt.disabled = true; out.innerHTML = '<div class="s" style="margin-top:10px">Envoi en cours…</div>';
  const r = await notifSend(body); bt.disabled = false;
  if (r.error) { out.innerHTML = `<div class="err" style="margin-top:10px">${esc(r.error)}</div>`; return; }
  const sans = r.membres - r.membres_joignables;
  out.innerHTML = `<div class="ok" style="margin-top:10px">✅ Envoyée à ${r.envoyes} téléphone(s) (${r.membres_joignables} membre(s)).${sans > 0 ? `<br>${sans} membre(s) n’ont pas encore activé les notifications.` : ''}${r.echecs ? `<br>${r.echecs} téléphone(s) n’ont pas répondu (notifications retirées ou appli désinstallée).` : ''}</div>`;
  e.target.reset(); $('#ml').style.display = 'none';
  setTimeout(async () => { if (page === 'notify') { const c = $('#c'); const keep = out.innerHTML; c.innerHTML = await notifyV(); const n = $('#nres'); if (n) n.innerHTML = keep; } }, 600);
}

SB.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && me) { me = null; page = 'home'; tab = 'in'; render(); } });
boot();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
